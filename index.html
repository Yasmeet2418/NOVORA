<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOVORA — Learn. Practice. Rise.</title>
    <meta
      name="description"
      content="NOVORA is an AI-powered learning and competitive examination preparation platform with step-by-step academic support, syllabus intelligence, smart notes, and mock tests."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23082B37'/%3E%3Cpath d='M8 24V8l16 16V8' stroke='%2339B981' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='25' cy='7' r='3' fill='%23D6AD43'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: sans-serif; color: #64748B;">
        <div style="text-align: center;">
          <div style="font-size: 2.5rem; margin-bottom: 12px; animation: spin 1s linear infinite; display: inline-block;">⚡</div>
          <h2 style="color: #0F2E39; font-weight: 700;">Loading NOVORA...</h2>
          <p style="margin-top: 6px; font-size: 0.9rem;">Empowering your learning and exam preparation.</p>
        </div>
      </div>
    </div>

    <div id="ai-chat-widget">
      <section class="ai-chat-panel" id="ai-chat-panel" aria-labelledby="ai-chat-title" hidden>
        <header class="ai-chat-header">
          <div class="ai-chat-brand">
            <span class="ai-chat-avatar" aria-hidden="true">✦</span>
            <div>
              <h2 id="ai-chat-title">AI Assistant</h2>
              <p>Ask me anything</p>
            </div>
          </div>
          <button class="ai-chat-close" id="ai-chat-close" type="button" aria-label="Close AI Assistant">×</button>
        </header>
        <div class="ai-chat-messages" id="ai-chat-messages" role="log" aria-live="polite" aria-relevant="additions text">
          <div class="ai-chat-row ai-chat-row-assistant">
            <p class="ai-chat-bubble">Hi! How can I help you today?</p>
          </div>
          <div class="ai-chat-thinking" id="ai-chat-thinking" role="status" hidden>
            <span class="ai-chat-thinking-dots" aria-hidden="true"><i></i><i></i><i></i></span>
            <span>Thinking...</span>
          </div>
        </div>
        <form class="ai-chat-form" id="ai-chat-form">
          <label class="sr-only" for="ai-chat-input">Message the AI Assistant</label>
          <input
            id="ai-chat-input"
            name="message"
            type="text"
            maxlength="20000"
            autocomplete="off"
            placeholder="Type your message..."
            required
          />
          <button class="ai-chat-send" id="ai-chat-send" type="submit">
            <span>Send</span><span aria-hidden="true">↑</span>
          </button>
        </form>
      </section>
      <button
        class="ai-chat-toggle"
        id="ai-chat-toggle"
        type="button"
        aria-label="Open AI Assistant"
        aria-controls="ai-chat-panel"
        aria-expanded="false"
      >
        <span aria-hidden="true">✦</span>
      </button>
    </div>

    <!-- Main Module Application Script -->
    <script type="module" src="./app.js"></script>
    <script type="module" src="./aiChatWidget.js"></script>
  </body>
</html>
